<text x="1402" y="190" font-size="19" font-weight="800" fill="#123D2B">Циркуляція</text>
<text x="1402" y="224" font-size="15" fill="#333">• Вхід → хол</text>
<text x="1402" y="250" font-size="15" fill="#333">• Хол → майстер-крило</text>
<text x="1414" y="270" font-size="15" fill="#333">(спальня + с/в приватно)</text>
<text x="1402" y="296" font-size="15" fill="#333">• Хол → вітальня</text>
<text x="1402" y="322" font-size="15" fill="#333">• З вітальні: друга</text>
<text x="1414" y="342" font-size="15" fill="#333">спальня, с/в гість, сауна</text>
<text x="1402" y="368" font-size="15" fill="#333">• Друга спальня — НЕ</text>
<text x="1414" y="388" font-size="15" fill="#333">через майстер (виправлено)</text>
<text x="1402" y="414" font-size="15" fill="#333">• Сауна + чан = SPA-зона</text>
<text x="1402" y="440" font-size="15" fill="#333">• Джакузі — біля вікна</text>
<text x="1402" y="486" font-size="13" fill="#8a8a8a">Площі орієнтовні;</text>
<text x="1402" y="506" font-size="13" fill="#8a8a8a">фінальні — за проєктом.</text>
