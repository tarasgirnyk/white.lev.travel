<text x="1420" y="190" font-size="19" font-weight="800" fill="#123D2B">VIP — флагман</text>
<text x="1420" y="224" font-size="15" fill="#333">• 2 спальні (майстер +</text>
<text x="1432" y="245" font-size="15" fill="#333">друга)</text>
<text x="1420" y="274" font-size="15" fill="#333">• 2 санвузли; джакузі</text>
<text x="1432" y="295" font-size="15" fill="#333">біля вікна з видом</text>
<text x="1420" y="324" font-size="15" fill="#333">• Велика вітальня-</text>
<text x="1432" y="345" font-size="15" fill="#333">їдальня + острів, камін</text>
<text x="1420" y="374" font-size="15" fill="#333">• SPA: сауна + чан</text>
<text x="1432" y="395" font-size="15" fill="#333">(приватна зона)</text>
<text x="1420" y="424" font-size="15" fill="#333">• Найбільша тераса —</text>
<text x="1432" y="445" font-size="15" fill="#333">топ видова точка</text>
<text x="1420" y="474" font-size="15" fill="#333">• Той самий стиль</text>
<text x="1432" y="495" font-size="15" fill="#333">лінійки</text>
<text x="1420" y="540" font-size="13" fill="#8a8a8a">Площі орієнтовні;</text>
<text x="1420" y="559" font-size="13" fill="#8a8a8a">фінальні — за проєктом.</text>
