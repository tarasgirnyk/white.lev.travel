<text x="1104" y="192" font-size="22" font-weight="800" fill="#123D2B">Циркуляція</text>
<text x="1104" y="230" font-size="17" fill="#333">• Вхід → тамбур (розподільник)</text>
<text x="1104" y="258" font-size="17" fill="#333">• З тамбура — окремі двері у:</text>
<text x="1116" y="284" font-size="17" fill="#333">санвузол, спальню, вітальню</text>
<text x="1104" y="312" font-size="17" fill="#333">• Спальня має і другий вхід</text>
<text x="1116" y="336" font-size="17" fill="#333">з вітальні</text>
<text x="1104" y="364" font-size="17" fill="#333">• Жодного проходу крізь ванну</text>
<text x="1104" y="410" font-size="15" fill="#8a8a8a">Площі орієнтовні; фінальні дасть</text>
<text x="1104" y="432" font-size="15" fill="#8a8a8a">архітектурний проєкт (ЕП/РД).</text>
