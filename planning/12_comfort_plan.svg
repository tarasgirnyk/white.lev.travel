<text x="1112" y="192" font-size="20" font-weight="800" fill="#123D2B">Відмінності від Compact</text>
<text x="1112" y="232" font-size="17" fill="#333">• Більша кухня-вітальня-їдальня + острів</text>
<text x="1112" y="262" font-size="17" fill="#333">• Обідній стіл на 6 · камін</text>
<text x="1112" y="292" font-size="17" fill="#333">• Ванна/джакузі біля вікна з видом</text>
<text x="1112" y="322" font-size="17" fill="#333">• Більша спальня (14–16 м²)</text>
<text x="1112" y="352" font-size="17" fill="#333">• Більша тераса + міні-сауна (опція)</text>
<text x="1112" y="382" font-size="17" fill="#333">• Той самий єдиний стиль лінійки</text>
<text x="1112" y="430" font-size="15" fill="#8a8a8a">Площі орієнтовні; фінальні дасть</text>
<text x="1112" y="452" font-size="15" fill="#8a8a8a">архітектурний проєкт (ЕП/РД).</text>
