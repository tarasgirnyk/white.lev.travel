<text x="1112" y="192" font-size="20" font-weight="800" fill="#123D2B">Циркуляція</text>
<text x="1112" y="230" font-size="17" fill="#333">• Вхід → тамбур (розподільник)</text>
<text x="1112" y="260" font-size="17" fill="#333">• З тамбура: у санвузол, спальню</text>
<text x="1124" y="284" font-size="17" fill="#333">і у вітальню — окремі двері</text>
<text x="1112" y="314" font-size="17" fill="#333">• Спальня має і другий вхід</text>
<text x="1124" y="338" font-size="17" fill="#333">з вітальні (зручність)</text>
<text x="1112" y="368" font-size="17" fill="#333">• Жодного проходу крізь ванну</text>
<text x="1112" y="398" font-size="17" fill="#333">• Ванна/джакузі — біля вікна</text>
<text x="1112" y="446" font-size="15" fill="#8a8a8a">Площі орієнтовні; фінальні дасть</text>
<text x="1112" y="468" font-size="15" fill="#8a8a8a">архітектурний проєкт (ЕП/РД).</text>
