services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wlt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wlt}
      POSTGRES_DB: ${POSTGRES_DB:-whitelevtravel}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wlt}']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-wlt}:${POSTGRES_PASSWORD:-wlt}@db:5432/${POSTGRES_DB:-whitelevtravel}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://white.lev.travel}
      SEED_ON_INIT: ${SEED_ON_INIT:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-gor@miotex.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-white.lev.travel}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  media:
  caddy-data:
  caddy-config:
