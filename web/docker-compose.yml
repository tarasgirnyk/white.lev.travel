services:
  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URI: ${DATABASE_URI}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://white.lev.travel}
      SEED_ON_INIT: ${SEED_ON_INIT:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-gor@miotex.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MEDIA_DIR: /app/media
    # Доступ до нативного Postgres на самому сервері (не в контейнері).
    # host.docker.internal вказує з контейнера на хост-машину.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - media:/app/media
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-white.lev.travel}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  media:
  caddy-data:
  caddy-config:
