services:
  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URI: ${DATABASE_URI}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://white.lev.travel}
      SEED_ON_INIT: ${SEED_ON_INIT:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-gor@miotex.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MEDIA_DIR: /app/media
    # Доступ до нативного Postgres на самому сервері (не в контейнері).
    # host.docker.internal вказує з контейнера на хост-машину.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - media:/app/media
    # TLS і роутинг за доменом бере на себе системний nginx на хості
    # (як для green.lev.travel та інших проєктів на цьому сервері).
    # Контейнер слухає лише локально на 127.0.0.1:3300.
    ports:
      - '127.0.0.1:3300:3000'

volumes:
  media:
